name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_CHANNEL: github
      OTA_PINNED_CA_ENABLED: 'false'
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'build-tools;36.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :tunnel:testReleaseUnitTest :ui:lintRelease :ui:assembleRelease --stacktrace

    - name: Get version from gradle.properties
      id: version
      run: |
        VERSION_NAME=$(grep wireguardVersionName gradle.properties | cut -d'=' -f2)
        VERSION_CODE=$(grep wireguardVersionCode gradle.properties | cut -d'=' -f2)
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "release_tag=v${VERSION_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME"

    - name: Generate release notes
      id: release_notes
      run: |
        COMMIT_SUBJECT=$(git log -1 --format=%s)
        COMMIT_BODY=$(git log -1 --format=%b)
        {
          echo "## ${COMMIT_SUBJECT}"
          echo
          printf '%s\n' "${COMMIT_BODY}"
        } > RELEASE_NOTES.md
        echo "release_notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        APK_DIR="ui/build/outputs/apk/release"
        mkdir -p release-assets
        SRC=""
        if [ -f "$APK_DIR/ui-release.apk" ]; then
          SRC="$APK_DIR/ui-release.apk"
        elif [ -f "$APK_DIR/ui-universal-release.apk" ]; then
          SRC="$APK_DIR/ui-universal-release.apk"
        else
          echo "No expected release APK found in $APK_DIR"
          ls -la "$APK_DIR" || true
          exit 1
        fi
        cp "$SRC" "release-assets/wg-turn-v${{ steps.version.outputs.version }}.apk"

    - name: Verify public update configuration and APK resources
      run: |
        python3 - <<'PY'
        import pathlib
        import zipfile

        config = pathlib.Path('ui/build/generated/source/buildConfig/release/com/wireguard/android/BuildConfig.java').read_text()
        assert 'UPDATE_CHANNEL = "github"' in config
        assert 'OTA_PINNED_CA_ENABLED = false' in config
        assert 'OTA_RELEASE_META_URL = ""' in config
        assert 'OTA_DEBUG_META_URL = ""' in config
        for apk in pathlib.Path('release-assets').glob('*.apk'):
            with zipfile.ZipFile(apk) as archive:
                forbidden = [name for name in archive.namelist() if
                    'ota_root_ca' in name or name.endswith(('.pem', '.jks', '.keystore', '.key'))]
                assert not forbidden, f'Local assets in APK: {forbidden}'
        PY

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: release-assets
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Prepare OTA assets
      id: ota_assets
      run: |
        APK_DIR="release-assets"
        SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
        OTA_APK="${APK_DIR}/ota-release.apk"
        OTA_JSON="${APK_DIR}/ota-release.json"
        cp "${SIGNED_APK}" "${OTA_APK}"
        "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose "${OTA_APK}"
        SHA256=$(sha256sum "${OTA_APK}" | awk '{print $1}')
        cat > "${OTA_JSON}" <<EOF
        {
          "version_code": ${{ steps.version.outputs.version_code }},
          "version_name": "${{ steps.version.outputs.version }}",
          "apk_url": "https://github.com/${{ github.repository }}/releases/latest/download/ota-release.apk",
          "sha256": "${SHA256}"
        }
        EOF
        echo "ota_apk=${OTA_APK}" >> $GITHUB_OUTPUT
        echo "ota_json=${OTA_JSON}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        target_commitish: ${{ github.sha }}
        files: |
          ${{ steps.sign_app.outputs.signedReleaseFile }}
          ${{ steps.ota_assets.outputs.ota_apk }}
          ${{ steps.ota_assets.outputs.ota_json }}
        draft: false
        prerelease: false
        make_latest: true
        fail_on_unmatched_files: true
        name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
        body_path: ${{ steps.release_notes.outputs.release_notes_file }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
